services:
  - type: web
    name: wirtualny-trener-api
    env: docker
    plan: free
    dockerCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: YOLO_MODEL_PATH
        value: yolov8s.pt
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
